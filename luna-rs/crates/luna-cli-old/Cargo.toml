[package]
name = "luna-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "luna"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
luna-ast = { path = "../luna-ast" }
luna-driver = { path = "../luna-driver" }
serde_json = "1.0"
luna-llib = { path = "../luna-llib" }
