# Luna Canonical Sysroot Manifest
# Single Source of Truth for logical provider identities and physical layout.

[sysroot]
runtime_abi_version = 1

[[provider]]
name = "result"
path = "core/result"
visibility = "public"

[[provider]]
name = "ptr"
path = "core/ptr"
visibility = "public"

[[provider]]
name = "slice"
path = "core/slice"
visibility = "public"

[[provider]]
name = "mem"
path = "core/mem"
visibility = "public"

[[provider]]
name = "cmp"
path = "core/cmp"
visibility = "public"

[[provider]]
name = "hash"
path = "core/hash"
visibility = "public"

[[provider]]
name = "clone"
path = "core/clone"
visibility = "public"

[[provider]]
name = "copy"
path = "core/copy"
visibility = "public"

[[provider]]
name = "iter_adapters"
path = "core/iter_adapters"
visibility = "public"

[[provider]]
name = "iter_consumers"
path = "core/iter_consumers"
visibility = "public"

[[provider]]
name = "try"
path = "core/try"
visibility = "public"

[[provider]]
name = "io"
path = "io/io"
visibility = "public"

# --- Transitional Entries (Phase 3 Removal Candidates) ---
[[provider]]
name = "box"
path = "alloc/box"
visibility = "public"

[[provider]]
name = "vec"
path = "alloc/vec"
visibility = "public"

[[provider]]
name = "string"
path = "alloc/string"
visibility = "public"

[[provider]]
name = "hashmap"
path = "alloc/hashmap"
visibility = "public"

[[provider]]
name = "hashset"
path = "alloc/hashset"
visibility = "public"

[[provider]]
name = "iter_collect"
path = "alloc/iter_collect"
visibility = "public"

# ---------------------------------------------------------

# --- Internal / Implementation Providers ---
[[provider]]
name = "core/panic"
path = "core/panic"
visibility = "public"

[[provider]]
name = "__alloc_global"
path = "alloc/global"
visibility = "internal"

[[provider]]
name = "__raw_table"
path = "alloc/raw_table"
visibility = "internal"

# --- Language Contract Providers ---
[[provider]]
name = "__lang_drop"
path = "lang/drop"
visibility = "internal"
lang_contract = "drop"

[[provider]]
name = "__lang_option"
path = "lang/option"
visibility = "internal"
lang_contract = "option"

[[provider]]
name = "__lang_iterator"
path = "lang/iterator"
visibility = "internal"
lang_contract = "iterator"

[[provider]]
name = "__lang_into_iterator"
path = "lang/into_iterator"
visibility = "internal"
lang_contract = "into_iterator"
