[package]
name = "mellis-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
inkwell = { version = "0.5.0", features = ["llvm18-0", "target-x86"] }
llvm-sys = { version = "180.0.0", features = ["no-llvm-linking"] }
mellis-common = { path = "../mellis-common" }
mellis-mvir = { path = "../mellis-mvir" }
mellis-semantic = { version = "0.1.0", path = "../mellis-semantic" }
thiserror = "2.0.20"
